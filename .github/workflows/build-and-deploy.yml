name: Deploy Site with PDF CV

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # --- FAST LATEX PDF COMPILATION (CACHED PDF + TECTONIC) ---

      - name: Cache compiled CV PDF
        id: pdf-cache
        uses: actions/cache@v4
        with:
          path: _site/assets/enrique-crespo-fernandez-cv.pdf
          key: cv-pdf-${{ hashFiles('_data/cv.yaml', 'enrique-crespo-fernandez-cv.tex') }}

      - name: Cache Tectonic binary & TeX bundle
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/tectonic
            ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1-${{ hashFiles('enrique-crespo-fernandez-cv.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-v1-

      - name: Install & Compile LaTeX CV with Tectonic
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin" _site/assets
          if [ ! -x "$HOME/.local/bin/tectonic" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
            mv tectonic "$HOME/.local/bin/tectonic"
          fi
          "$HOME/.local/bin/tectonic" -o _site/assets _site/assets/pdf/enrique-crespo-fernandez-cv.tex
          ls -lh _site/assets/enrique-crespo-fernandez-cv.pdf

      # ----------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
