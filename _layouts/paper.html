<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            (function() {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
                document.documentElement.classList.add(isDark ? 'dark-theme' : 'light-theme');
            })();
        </script>

        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="description" content="{{ page.title }} — {{ site.title }}"/>
        <meta name="author" content="{{ site.title }}"/>
        <title>{{ page.short_title | default: page.title }} | {{ site.title }}</title>
        <link rel="icon" type="image/x-icon" href="/{{ site.icon-pic }}"/>

        <script defer src="https://use.fontawesome.com/releases/v5.15.3/js/all.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500&family=Poiret+One&display=swap" rel="stylesheet">
        <link href="/styles/styles.css?v={{ site.time | date: '%s' }}" rel="stylesheet"/>
    </head>

    <body>
        <canvas id="symbolic-canvas" aria-hidden="true"></canvas>

        <button class="toggle-theme-button" onclick="toggleTheme()" aria-label="Toggle dark/light theme" title="Toggle theme">◐</button>

        <div class="paper-shell">
            <nav class="paper-topbar" aria-label="Paper navigation">
                <a href="/#research" class="paper-back-link"><i class="fas fa-arrow-left icon-mr"></i>Back to Publications</a>
                <div class="paper-topbar-right">
                    <a href="/" class="paper-nav-item">Home</a>
                    <a href="/cv_page.html" class="paper-nav-item">CV</a>
                </div>
            </nav>

            <main class="paper-article">
                {{ content }}
            </main>

            <footer class="paper-footer">
                <div>© {{ site.title }}, <span id="currentYear"></span></div>
                <a href="/#research">All Publications →</a>
            </footer>
        </div>

        <script defer src="/js/scripts.js?v={{ site.time | date: '%s' }}"></script>
    </body>
</html>
