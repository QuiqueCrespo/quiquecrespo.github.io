<div class="timeline-item">
    <div class="timeline-marker" aria-hidden="true">◆</div>
    <div class="timeline-date">
        {% assign date_parts = update.time | split: ' ' %}
        <span class="update-month">{{ date_parts[0] | upcase }}</span>
        <span class="update-year">{{ date_parts[1] }}</span>
    </div>
    <div class="timeline-content">
        {{ update.desc }}
    </div>
</div>
