# About me
first-paragraph: >-
  I am a PhD candidate in the UKRI-funded <a href="https://www.bristol.ac.uk/cdt/interactive-ai/" target="_blank" rel="noopener"><span class="highlight">Interactive Artificial Intelligence CDT</span></a> at the <a href="https://www.bristol.ac.uk/" target="_blank" rel="noopener">University of Bristol</a>, supervised by <a href="https://research-information.bris.ac.uk/en/persons/peter-a-flach" target="_blank" rel="noopener">Prof. Peter Flach</a>, <a href="https://research-information.bris.ac.uk/en/persons/telmo-de-menezes-e-silva-filho" target="_blank" rel="noopener">Dr. Telmo de Menezes e Silva Filho</a>, and <a href="https://research-information.bris.ac.uk/en/persons/oliver-ray" target="_blank" rel="noopener">Dr. Oliver Ray</a>. My research sits at the intersection of neuro-symbolic reasoning, program synthesis, and adaptive sequence modelling—combining neural networks with inductive logic programming to accelerate symbolic search and learn continual causal world models, alongside work on weight-space linear recurrent architectures and physics-informed in-context learning.

second-paragraph: >-
  Previously, I earned a First-Class Honours BSc in Mathematics &amp; Physics at the <a href="https://www.bath.ac.uk/" target="_blank" rel="noopener">University of Bath</a> (2023), where my dissertation built a CNN-based detector for extreme sea-wave events from noisy coastal radar scans in collaboration with the <a href="https://www.metoffice.gov.uk/" target="_blank" rel="noopener">UK Met Office</a>. During my degree, I also worked as a Data Scientist Intern at <a href="https://www.lukkap.com/" target="_blank" rel="noopener">Lukkap</a>, building end-to-end NLP and statistical psychometric pipelines to extract actionable signal from large-scale survey data.

