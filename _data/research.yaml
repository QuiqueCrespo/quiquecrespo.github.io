  - title: Weight-Space Linear Recurrent Neural Networks
    page: /papers/warp.html
    conference: ICLR 2026
    conference-web: https://iclr.cc/virtual/2026/poster/10006465
    status:
    authors: "Roussel Desmond Nzoyem, Nawid Keshtmand, <u>Enrique Crespo-Fernandez</u>, Idriss Tsayem, Raul Santos-Rodriguez, David A. W. Barton, Tom Deakin"
    arxiv: https://arxiv.org/abs/2506.01153
    pdf: assets/papers/WEIGHT-SPACE_LINEAR_RECURRENT_NEURAL_NETWORKS.pdf
    code: https://github.com/ddrous/warp
    demo:
    slides:
    talk:
    poster:
    bibtex: |
      @inproceedings{nzoyem2026weightspace,
        title={Weight-Space Linear Recurrent Neural Networks},
        author={Nzoyem, Roussel Desmond and Keshtmand, Nawid and Crespo-Fernandez, Enrique and Tsayem, Idriss and Santos-Rodriguez, Raul and Barton, David A. W. and Deakin, Tom},
        booktitle={International Conference on Learning Representations (ICLR)},
        year={2026}
      }
    abstract-less: >-
      We introduce WARP (Weight-space Adaptive Recurrent Prediction), a simple yet powerful model that unifies weight-space learning with linear recurrence to redefine sequence modelling. Unlike conventional recurrent neural networks (RNNs)
    abstract-more: >-
      which collapse temporal dynamics into fixed-dimensional hidden states, WARP explicitly parametrises its hidden state as the weights and biases of a distinct auxiliary neural network, and uses input differences to drive its recurrence. This brain-inspired formulation enables efficient gradient-free adaptation of the auxiliary network at test-time, in-context learning abilities, and seamless integration of domain-specific physical priors. Empirical validation shows that WARP matches or surpasses state-of-the-art baselines on diverse classification tasks, featuring in the top three in 5 out of 6 real-world challenging datasets. Furthermore, extensive experiments across sequential image completion, multivariate time series forecasting, and dynamical system reconstruction demonstrate its expressiveness and generalisation capabilities. Remarkably, a physics-informed variant of our model outperforms the next best model by more than 10x. Ablation studies confirm the architectural necessity of key components, solidifying weight-space linear RNNs as a transformative paradigm for adaptive machine intelligence.
    tag: weight-space-lrnn
    category: Sequence Modelling

  - title: Continual Learning and Refinement of Causal Models through Dynamic Predicate Invention
    page: /papers/continual-causal-ilp.html
    conference: UCRL Workshop @ ICLR 2026
