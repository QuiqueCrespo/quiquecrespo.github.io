    status:
    authors: "<u>Enrique Crespo-Fernandez</u>, Oliver Ray, Telmo de Menezes e Silva Filho, Peter Flach"
    arxiv: https://arxiv.org/abs/2602.17217
    pdf: https://arxiv.org/pdf/2602.17217
    code:
    demo:
    slides:
    talk:
    poster:
    bibtex: |
      @inproceedings{crespo2026continual,
        title={Continual Learning and Refinement of Causal Models through Dynamic Predicate Invention},
        author={Crespo-Fernandez, Enrique and Ray, Oliver and de Menezes e Silva Filho, Telmo and Flach, Peter},
        booktitle={Workshop on Unifying Concept Representation Learning (UCRL) at ICLR},
        year={2026}
      }
    abstract-less: >-
      Efficiently navigating complex environments requires agents to internalise the underlying logic of their world, yet standard world modelling methods often struggle with sample inefficiency, lack of transparency, and poor scalability.
    abstract-more: >-
      We propose a framework for constructing symbolic causal world models entirely online by integrating continuous model learning and repair into the agent's decision loop. By leveraging Meta-Interpretive Learning and predicate invention to find semantically meaningful and reusable abstractions, our approach allows an agent to construct a hierarchy of disentangled, high-quality concepts from its observations. We demonstrate that our lifted inference approach scales to domains with complex relational dynamics, where propositional methods suffer from combinatorial explosion, while achieving sample-efficiency orders of magnitude higher than the established PPO neural-network-based baseline.
    tag: continual-causal-ilp
    category: Neuro-Symbolic AI
